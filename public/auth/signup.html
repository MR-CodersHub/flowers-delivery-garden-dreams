<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account • Garden Dreams</title>
  <meta name="description" content="Create a free Garden Dreams account for member pricing, delivery control and a welcome bouquet credit on your first order.">

  <script src="../../src/js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>

  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../src/css/components.css">
  <link rel="icon" href="../../assets/img/logo.png">
</head>
<body data-root="../../">

  <main>

    <!-- ============================ 1. SIGN UP ============================ -->
    <section class="auth-section">
      <div class="container">
        <div class="auth-back-nav">
          <a href="../../index.html" class="auth-back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Garden Dreams
          </a>
        </div>

        <div class="auth-card">
          <div class="auth-brand-header">
            <a href="../../index.html" class="auth-brand-logo" title="Back to Garden Dreams Home">
              <img src="../../assets/img/logo.png" alt="Garden Dreams logo" width="46" height="46">
              <span class="auth-brand-name">Garden <span class="pink-accent">Dreams</span></span>
            </a>
          </div>

          <h1>Create your account</h1>
          <p class="auth-sub">Already a member? <a href="../../public/auth/login.html">Log in instead</a></p>

          <form class="auth-form" data-validate="signup" novalidate>
            <div class="form-group">
              <label class="form-label" for="signup-name">Full name <span class="req">*</span></label>
              <input class="form-control" type="text" id="signup-name" name="name" placeholder="Jordan Blake" autocomplete="name" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-email">Email address <span class="req">*</span></label>
              <input class="form-control" type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-password">Password <span class="req">*</span></label>
              <div class="password-wrap">
                <input class="form-control" type="password" id="signup-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                <button class="password-toggle" type="button" data-target="signup-password" aria-label="Show password"></button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-confirm">Confirm password <span class="req">*</span></label>
              <div class="password-wrap">
                <input class="form-control" type="password" id="signup-confirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password" minlength="8" data-confirm="#signup-password" required>
                <button class="password-toggle" type="button" data-target="signup-confirm" aria-label="Show password"></button>
              </div>
            </div>

            <div class="form-check">
              <input type="checkbox" id="signup-terms" name="terms" required>
              <label for="signup-terms">I agree to the <a href="../../public/pages/Terms-of-service.html">Terms of Service</a> and <a href="../../public/pages/Privacy-policy.html">Privacy Policy</a>.</label>
            </div>

            <div class="form-check">
              <input type="checkbox" id="signup-news" name="news">
              <label for="signup-news">Send me the Thursday bloom guide and studio offers.</label>
            </div>

            <button type="submit" class="btn btn-pink btn-block btn-lg">Create account</button>
          </form>

          <div class="auth-divider">or sign up with</div>

          <div class="social-auth-row">
            <button class="social-auth-btn" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.9h5.35c-.25 1.4-1.75 4.1-5.35 4.1-3.2 0-5.8-2.65-5.8-5.9s2.6-5.9 5.8-5.9c1.8 0 3.05.77 3.75 1.44l2.55-2.46C16.7 3.5 14.6 2.6 12 2.6 6.9 2.6 2.8 6.7 2.8 11.8S6.9 21 12 21c5.25 0 8.75-3.7 8.75-8.9 0-.6-.07-1.05-.15-1.5z"/></svg>
              Google
            </button>
            <button class="social-auth-btn" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.36 12.78c.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.19-1.73-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.87-.76-1.48.02-2.84.86-3.6 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.25 2.74 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.08 2.65-2.14.83-1.23 1.18-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5zM14.1 5.4c.6-.74 1.01-1.76.9-2.78-.87.04-1.93.58-2.56 1.31-.56.65-1.05 1.7-.92 2.7.97.08 1.97-.49 2.58-1.23z"/></svg>
              Apple
            </button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="../../src/js/toast.js"></script>
  <script src="../../src/js/form-validation.js"></script>
  <script src="../../src/js/auth.js"></script>
</body>
</html>
